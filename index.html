<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledenlijst WmV</title>
<meta name="theme-color" content="#2e5e4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledenlijst">
<style>
  html, body { margin:0; height:100%; background:#f6f8f7; }
  iframe { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; }
</style>
</head>
<body>
<!--
  ===========================================================
  HIER DE LINK VAN JE LEDENLIJST PLAKKEN (de web-app-URL die eindigt op /exec)
  Vervang alleen de tekst tussen de aanhalingstekens.
  ===========================================================
-->
<script>
  var LEDENLIJST_URL = "https://script.google.com/macros/s/AKfycbwUa0zP3Og0VosdB8R-9VwCdflIzCNIHKpv-nYlkHtQoJJotfHp0g5GVXbmsAZIMyKfZA/exec";
</script>

<iframe id="app" title="Ledenlijst" allow="clipboard-write"></iframe>
<script>
  document.getElementById('app').src = LEDENLIJST_URL;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
<script>
  // Laat de ledenlijst bellen, mailen, Signal en WhatsApp openen vanuit de app zelf
  // (zonder "Doorgaan"-melding; na het gesprek kom je gewoon terug in de app).
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    var d = e.data || {};
    if (d.type !== 'wmv-open' || typeof d.url !== 'string') return;
    if (!/^(tel:|mailto:|whatsapp:\/\/send\?phone=|sgnl:\/\/signal\.me\/)/.test(d.url)) return;
    var a = document.createElement('a');
    a.href = d.url;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
</script>
</body>
</html>
